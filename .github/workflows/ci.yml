name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - name: Release metadata
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm release:check --base "$BASE_REVISION"

  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [node-min, node-stable, bun-min, bun-stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node-min' && '26.0.0' || matrix.runtime == 'node-stable' && 'node' || '26' }}
      - uses: oven-sh/setup-bun@v2
        if: startsWith(matrix.runtime, 'bun')
        with:
          bun-version: ${{ matrix.runtime == 'bun-min' && '1.4.0' || 'latest' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm docs:check
      - name: Node tests and coverage
        if: startsWith(matrix.runtime, 'node')
        run: pnpm test:coverage
      - name: Bun tests
        if: startsWith(matrix.runtime, 'bun')
        run: pnpm test:bun
      - name: Node published package
        if: startsWith(matrix.runtime, 'node')
        run: pnpm test:package
      - name: Bun published package
        if: startsWith(matrix.runtime, 'bun')
        run: pnpm test:package:bun
